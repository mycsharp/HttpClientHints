# Release Drafter Configuration
# Documentation: https://github.com/release-drafter/release-drafter

name-template: 'Version $RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

# Categories for organizing release notes. A pull request appears in every category whose labels it has,
# so pr-labeler.yml reconciles the managed category when the title changes.
categories:
  - title: '💥 Breaking Changes'
    labels:
      - 'breaking-change'
  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'bug'
      - 'fix'
  - title: '🔧 Maintenance'
    labels:
      - 'maintenance'
      - 'chore'
      - 'refactor'
      - 'dependencies'
  - title: '📚 Documentation'
    labels:
      - 'documentation'
      - 'docs'
  - title: '⚡ Performance'
    labels:
      - 'performance'
  - title: '🔒 Security'
    labels:
      - 'security'

# Exclude certain labels from release notes
exclude-labels:
  - 'skip-changelog'
  - 'wip'

# Change template (how each PR is listed)
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&' # Escape special markdown characters

# Template for the release body
template: |
  ## What's Changed

  $CHANGES

  ## 📦 NuGet Packages

  The following packages are included in this release:

  - `MyCSharp.HttpClientHints`
  - `MyCSharp.HttpClientHints.AspNetCore`

  ### Installation

  ```bash
  dotnet add package MyCSharp.HttpClientHints
  dotnet add package MyCSharp.HttpClientHints.AspNetCore
  ```

  ## Contributors

  $CONTRIBUTORS

  ---

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

# Label the changed areas. The workflow manages title-based categories separately.
autolabeler:
  - label: 'github-actions'
    files:
      - '.github/workflows/**/*'
  - label: 'tests'
    files:
      - 'tests/**/*'

# Version resolver (uses version from workflow input)
version-resolver:
  default: patch
