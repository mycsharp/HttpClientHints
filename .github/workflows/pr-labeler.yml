name: PR Labeler

# Labels pull requests with the autolabeler rules of .github/release-drafter.yml, so that the draft release
# sorts them into categories. pull_request_target also labels pull requests from forks; the workflow does not
# check out or run code of the pull request, it only reads its title, branch and changed files.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  label:
    name: Label pull request
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Label pull request
        uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-name: release-drafter.yml
          disable-releaser: true
