name: Publish Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of the published GitHub release whose packages to publish, for example v3.2.3'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-nuget:
    name: Publish to NuGet.org
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Download the release assets
      id-token: write # Request the GitHub OIDC token for NuGet Trusted Publishing

    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: eng
          persist-credentials: false

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python3 -m eng.download_release_packages

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.x

      - name: Verify packages
        shell: python
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          import os
          from pathlib import Path
          from xml.etree import ElementTree
          from zipfile import ZipFile

          tag = os.environ["RELEASE_TAG"]
          version = tag.removeprefix("v")
          expected = {"MyCSharp.HttpClientHints", "MyCSharp.HttpClientHints.AspNetCore"}
          packages = sorted(Path("artifacts").glob("*.nupkg"))
          if len(packages) != len(expected):
              raise SystemExit(f"Expected both release packages for {tag}, found {packages}")
          for package in packages:
              with ZipFile(package) as archive:
                  manifests = [name for name in archive.namelist() if "/" not in name and name.endswith(".nuspec")]
                  if len(manifests) != 1:
                      raise SystemExit(f"Expected one package manifest in {package}")
                  manifest = ElementTree.fromstring(archive.read(manifests[0]))
              package_id = manifest.findtext("{*}metadata/{*}id")
              package_version = manifest.findtext("{*}metadata/{*}version")
              if package_id not in expected or package_version != version:
                  raise SystemExit(f"Unexpected package {package_id} {package_version} in {package} for {tag}")
              expected.remove(package_id)
              print(f"Verified {package_id} {package_version}")

      # Trusted Publishing: exchanges the GitHub OIDC token for a NuGet API key that is valid for one hour.
      # Requires a Trusted Publishing policy on nuget.org for this repository and release-publish.yml,
      # and the NUGET_USER secret with the nuget.org profile name of the account that created the policy.
      # https://learn.microsoft.com/nuget/nuget-org/trusted-publishing
      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          for package in ./artifacts/*.nupkg; do
            echo "Publishing $package to NuGet.org..."
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

          echo "All packages published successfully!"

      - name: Upload published packages as artifacts
        uses: actions/upload-artifact@v6
        with:
          name: published-nuget-packages
          path: ./artifacts/*.nupkg
          retention-days: 90
