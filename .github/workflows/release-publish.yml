name: Publish Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of the GitHub release whose packages to publish, for example v3.2.3'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-nuget:
    name: Publish to NuGet.org
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Download the release assets
      id-token: write # Request the GitHub OIDC token for NuGet Trusted Publishing

    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release download "$RELEASE_TAG" \
            --pattern "*.nupkg" \
            --dir ./artifacts \
            --repo "${{ github.repository }}"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.x

      - name: Verify packages
        run: |
          echo "Packages to be published:"
          ls -la ./artifacts/*.nupkg

          # Verify package count
          PACKAGE_COUNT=$(ls ./artifacts/*.nupkg | wc -l)
          if [ "$PACKAGE_COUNT" -eq 0 ]; then
            echo "Error: No packages found!"
            exit 1
          fi

          echo "Found $PACKAGE_COUNT package(s) to publish"

      # Trusted Publishing: exchanges the GitHub OIDC token for a NuGet API key that is valid for one hour.
      # Requires a Trusted Publishing policy on nuget.org for this repository and release-publish.yml,
      # and the NUGET_USER secret with the nuget.org profile name of the account that created the policy.
      # https://learn.microsoft.com/nuget/nuget-org/trusted-publishing
      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          for package in ./artifacts/*.nupkg; do
            echo "Publishing $package to NuGet.org..."
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

          echo "All packages published successfully!"

      - name: Upload published packages as artifacts
        uses: actions/upload-artifact@v6
        with:
          name: published-nuget-packages
          path: ./artifacts/*.nupkg
          retention-days: 90
